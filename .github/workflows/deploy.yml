name: Deploy tuanhuy_computer to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/html
            git pull origin main
            mkdir -p storage uploads/products
            chmod -R 777 storage uploads/products 2>/dev/null || true
            chmod 777 app/Views/home 2>/dev/null || true
            chmod 666 app/Views/home/index.php app/Views/home/index.php.bak 2>/dev/null || true
            chmod -R 777 assets/images 2>/dev/null || true
